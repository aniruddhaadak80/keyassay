name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build

  browser:
    name: browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    # The embedded PGlite adapter is refused under `next start`, and it crashes a
    # bundled production server outright, so the browser job runs against a real
    # Postgres. The schema is created idempotently on first connect, so no
    # migration step is needed.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keyassay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keyassay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the production build
        run: |
          npm run build
          npm start &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/keyassay

      - name: Browser journey, desktop and mobile
        run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:3000